# For the alembic command, run from backend/ - to write a new migration:
#
#     ..\.venv\Scripts\alembic revision --rev-id 0003 --autogenerate -m "what changed"
#
# and read what it wrote before trusting it.
# The app never reads this file: it applies migrations itself at start-up
# (app/db/migrate.py). The database address comes from SCORECARD_DB, the
# same as everywhere else - see app/db/migrations/env.py.

[alembic]
script_location = app/db/migrations
# 0003_what_changed.py - numbered, so the folder reads in the order it runs.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
