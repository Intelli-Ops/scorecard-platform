# Kpi high-level - steps doc phase 8 (sql-doc) and phase 9 (scorecard numbers). the sheet is a stack of small blocks, each one a list of provider-group rows and usually a total row. only one column is written each week: the one whose 'period start' date (row 2) falls in the month being reported. everything else is history and is left exactly as the template had it. ---------------------------------------------------------------------------
kpi:
  sheet: "KPI High-Level"
  period_row: 2               # 'Period Start'; Excel serial dates
  first_col: 3                # C
  last_col: 40

  gfs_type_value: GFS         # SQL-Doc 'Type' filter
  provider_id_column: BUSINESSREGID     # in the Supporting File 'Provider List'
  provider_group_column: Provider Group

  # SQL-Doc export column names, as they come out of Superset.
  sql_doc_columns:
    provider_id: ProviderID
    type: Type
    month: DocumentMonth
    document_type: DocumentType
    cases: "#ofcases"

  # Phase 9 - the KPI-numbers table pasted from email.
  scorecard:
    file_match: [kpi, number]
    sheet: Sheet1
    block_start: GFS Client
    block_end: GFS Total
