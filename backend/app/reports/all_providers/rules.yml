# Business rules for the ALL PROVIDERS Weekly Scorecard.
#
# This file belongs to the All Providers report ONLY. The GFS report has its own
# copy under ..\config\rules.yml and the two must never be merged: they filter
# different rows, they roll up to different sheets, and a change to one is almost
# never a change to the other.
#
# The single biggest difference: the GFS report keeps only cases owned by
# GFS / GFS-SPV / Med Legal and only "Type = GFS" settlements. This report keeps
# EVERY provider that appears in the Supporting File's Provider List. There is no
# owner filter and no Type filter anywhere below.
#
# Layout - which row a group sits on, which column a month sits in - is NOT in this
# file. It is read from the template workbook every run (see ap/render/layout.py),
# because the All Providers sheets grow a week column each week and re-typing that
# here would rot within a month.

case_ar:

  # PHASE 1 - which rows of Combined Owner Case AR are in scope.
  # Steps doc: 'In "Case_Type" column only select Alternative/CopyRecord/WC/Workers
  # Compensation'. Unlike GFS there is NO "OWNER NAME" filter - every owner counts.
  case_types:                # doc shorthand -> the real values in the file
    - Workers Compensation                      # "WC" / "Workers Compensation"
    - Copy Record (ML)                          # "CopyRecord"
    - Alternative Dispute Resolution (ADR)      # "Alternative"

  # PHASE 2 - rows whose BUSINESSREGID is not in the Provider List get dropped
  # ("In Group column, filter out all the NA values delete all data").
  drop_rows_without_group: true

  # PHASE 2 - rows with no match in Custom Case AR get dropped. Implemented as an
  # inner join on CASEID.
  drop_rows_without_status: true

  # PHASE 2 - Case_Validity cleanup. Verified: the delivered Week-34 workbook's
  # pivot cache holds exactly two validity values, Valid and Invalid.
  validity_map:
    Valid-Stay: Valid
  validity_blank_becomes: Valid

  # PHASE 2 - Closing Order. Source values carry a "CLOSING ORDER: " prefix which is
  # stripped, then only these three survive; everything else becomes CIC Pending.
  # EXACT match matters: "FINDING & AWARD" and "ORDER OF DISMISSAL OF CASE" contain
  # the words AWARD / DISMISSAL but must NOT be kept.
  closing_order_strip_prefix: 'CLOSING ORDER:'
  closing_order_keep:
    - C & R (GRANTED)
    - AWARD ON STIPULATED FINDS AND AWARD (GRANTED)
    - DISMISSAL OF CLAIM
  closing_order_default: CIC Pending

  # PHASE 3 - the pivot that produces Raw Data.
  # NOTE the column ORDER: the Case AR pivot addresses its fields by position
  # (rowField 7 = File Status, dataFields 0, 8, 9, 10, 11, 12), so these thirteen
  # columns must stay in this order or the pivot rebuilds against the wrong fields.
  raw_data_group_by: [CASEID, PROVIDER, BUSINESSREGID, Group, CASETYPE,
                      Closing Order, Case_Validity, FileStatus]
  raw_data_measures:  [BILLED, PAID, WRITEOFF, ADVANCE, OUTSTANDING]
  # Header text written onto the Raw Data sheet, in the same order as the two lists
  # above. The odd spacing is the template's own - " BILLED" really does carry a
  # leading space - and Excel rebuilds the pivot cache field names from this row.
  raw_data_headers: [CASEID, PROVIDER, BUSINESSREGID, Group, CASETYPE,
                     Closing Order, Validity, File Status,
                     " BILLED", " PAID", WRITEOFF, ADVANCE, OUTSTANDING]

# ---------------------------------------------------------------------------
delta:   # Phases 4, 5 and 6 -> Settlement grids + the Delta Comparison-2026 sheet
  # PHASE 4 - the 15 combine columns. Source names differ per sheet and the column
  # POSITIONS in the steps doc (wcColsNums / medColsNums / imrColsNums) are stale,
  # so everything is matched BY NAME.
  #
  # Two traps, both confirmed in the data:
  #   * the MLCR workbook also carries a "WC Delta" sheet and it is STALE - the WC
  #     sheet must come from the WC workbook.
  #   * the three sheets use different names for the same field (see below).
  sources:
    - sheet: WC Delta
      workbook: wc               # Master Settlement & Collection Delta WC
      columns:
        Date: Date
        Location: Location
        Case_ID: Case Id
        MRN: MRN
        Billed: Billed
        Paid: Paid
        Outstanding: Outstanding
        Settlement_Amount: Settlement Amount
        Settlement_Pct: Settlement %Age
        Provider_ID: ProviderID
        Provider: Provider
        Settlement_Payment: Settlement Payment
        Settlement_Payment_Received: Settlement Payment Received?
        Remaining_Payment: Remaining Payment
        File_Status: Settlement Payment Status
    - sheet: Med-Legal Delta
      workbook: mlcr
      columns:
        Date: Date
        Location: Location
        Case_ID: Case Id
        MRN: MRN
        Billed: Billed
        Paid: Paid
        Outstanding: Outstanding
        Settlement_Amount: Settlement Amount
        Settlement_Pct: Settlement %Age
        Provider_ID: ProviderID
        Provider: Provider
        Settlement_Payment: Settlement Payments        # note: plural
        Settlement_Payment_Received: Settlement Payment Received?
        Remaining_Payment: Remaining Payment
        File_Status: File Status
    - sheet: IMR Delta
      workbook: mlcr
      columns:
        Date: Date
        Location: Location
        Case_ID: Case Id
        MRN: MRN
        Billed: Billed
        Paid: Paid
        Outstanding: Outstanding
        Settlement_Amount: Settlement Amount
        Settlement_Pct: Settlement %Age
        Provider_ID: ProviderID
        Provider: Provider
        Settlement_Payment: Settlement Payment Received   # no "?" - a DIFFERENT
        Settlement_Payment_Received: Settlement Payment Received?   # column to this
        Remaining_Payment: Remaining Payment
        File_Status: New File Status

  # PHASE 5/6 - the only filter is "delete all NA in Group", i.e. drop providers the
  # Supporting File does not list. There is no Type filter and no "drop closed" here:
  # the All Providers sheets report the whole year of settlements, not the live ones.
  # Verified against the delivered Week-34 workbook: every January figure on both the
  # Settlement grids and the Delta Comparison-2026 grid reproduces exactly.
  drop_na_group: true
  year: 2026

  # PHASE 5 - Location splits the Settlement grids. Matched case-insensitively after
  # trimming, because the data holds "In House", "In house" and "in House".
  locations:
    In House: in house
    Board: board

  # PHASE 6 - Delta Comparison-2026: Group down the side, month across the top, each
  # month split by "Settlement Payment Received". Values are Settlement Amount over
  # ALL locations (In House + Board + NOI & CP), which is why a group's Delta figure
  # equals its In House + Board + CP Settled figures added together.
  payment_received_yes: SP - Y
  payment_received_no:  SP - N

# ---------------------------------------------------------------------------
collections:   # Phase 7 -> the Collections block of Collection High-Level-2026
  sheet: "  Detail Payment Report"     # note the two leading spaces
  drop_case_types: [PI]
  # "in payment type make 'board reps' & 'in house rep', 'settlement'" = fold them
  # INTO settlement, not rename them alongside it.
  fold_into_settlement: [BOARD REPS, IN HOUSE REPS, SETTLEMENT]
  payment_type_order: [BILLING, REBILLING, APPEAL, SETTLEMENT]
  # The sheet's "Week 01..05" are Excel WEEKNUM buckets - weeks start Sunday and
  # 1 January always falls in week 1. That is NOT week-of-month, and NOT the ISO
  # week Python gives by default.

# ---------------------------------------------------------------------------
pacing:
  # Run-rate: cumulative / (5 * weeks elapsed) * business days in the month.
  # The template's own formulas are =SUM(J9)/5*21 style, so the divisor grows by 5
  # a week and the multiplier is the month's business-day count.
  week_days: 5

# ---------------------------------------------------------------------------
kpi:   # Phase 8 (SQL-Doc) and Phase 9 (the litigation / scorecard numbers table)
  sheet: "KPI High-Level "          # NOTE the trailing space - it is in the template
  period_row: 2                     # 'Period Start'; Excel serial dates
  first_col: 3                      # C
  last_col: 40                      # scan this far right

  provider_id_column: BUSINESSREGID       # in the Supporting File 'Provider List'
  provider_group_column: Provider Group

  # SQL-Doc export column names, as they come out of Superset.
  sql_doc_columns:
    provider_id: ProviderID
    type: Type
    month: DocumentMonth
    document_type: DocumentType
    cases: "#ofcases"

  # Unlike GFS this report does NOT filter SQL-Doc on Type - GFS and Other Client
  # rows both belong here. The group still comes from the Supporting File, looked up
  # on ProviderID = BUSINESSREGID, never from SQL-Doc's own Provider_GROUP column:
  # the two disagree (SQL-Doc files Inland Empire Healthcare as its own group, the
  # Supporting File folds it into A Miles).
  filter_type: null

  # Which SQL-Doc DocumentType feeds which block of the sheet.
  sql_blocks:
    SBR: Appeals/SBR
    DDE: BillingDocs

  # Phase 9 - the litigation / scorecard numbers table pasted from email.
  # It stacks three blocks - GFS, Russman, Others - each with its own header row and
  # its own Total. This report reads ALL THREE; the GFS report reads only the first.
  scorecard:
    file_match: [kpi, number]
    sheet: Sheet1
    block_markers:                  # header marker -> total marker, read in order
      GFS Client: GFS Total
      Russman Client: Russman Total
      Others Client: Others Total
    lookup_column: PROVIDER ID      # Supporting File column the provider name matches
    # Names in the numbers file that do not spell the Provider List PROVIDER ID the
    # same way. Left side = exactly as written in the numbers file.
    provider_aliases:
      Support Claim West: SUPPORT CLAIMS WEST
      BHIPM: Beverly Hills Institute for Pain Management
      Soheil Enterprise DBA Alexander Pharmacy: Alexander Pharmacy
      JL Calpar Inc: JL Calpar
    metrics:                        # source column -> block whose rows are groups
      DOR Filing: DOR
      PMR Filing: PMR
      NTP Filing: NTP
      EOA Filing: Enforcement Of Agreement
      Medical Index: Medical Index
    totals:                         # source column -> [block, single row]
      NOI TO CP:       [Med Legal, NOI (COST)]
      NOI for Payment: [Med Legal, NOI for Payment]
      CP:              [Med Legal, Cost Petition]
      CP DOR:          [Med Legal, Cost Petition (DOR)]

  # Row labels on the KPI sheet that do not spell a Provider Group the same way.
  # Left side = as the sheet has it, right side = the Provider Group it means.
  # Anything not listed is matched on letters and digits alone, so "BayCo" already
  # finds "Bayco" without an entry here.
  row_aliases:
    Support Claim West: SUPPORT CLAIMS WEST

  # Blocks the sheet carries that no source feeds. Reported every run, never guessed.
  unsourced_blocks: ["10635 (DDEL)"]

# ---------------------------------------------------------------------------
template:
  # Sheet names in the delivered workbook. All Providers names them differently from
  # GFS - the Settlement grids live ON the Collection sheet, and there is no separate
  # "Settlement High-Level" sheet.
  grid_sheet:  "Collection High-Level-2026"
  delta_sheet: "Delta Comparison-2026"
  kpi_sheet:   "KPI High-Level "
  case_ar_sheet: "Case AR"
  raw_data_sheet: "Raw Data"
  # Sheets kept in the delivered file; anything else is dropped.
  keep_sheets:
    - "Collection High-Level-2026"
    - "Collection High-Level-2025"
    - "Delta Comparison-2026"
    - "Delta Comparison-2025"
    - "KPI High-Level "
    - "Case AR"
    - "Raw Data"
  # Add a row for any provider group that has figures this week and no row to put
  # them on, immediately above that block's Total. The new row copies the one above
  # it, so it arrives with the block's formatting and formulas, and every insertion
  # is named in STEP 4.
  #
  # Without this, such a group is reported and then simply left out of the client's
  # totals - which is how BHIP sat outside every figure on the report while having
  # settlements, payments, appeals and billing documents. Set to false to go back to
  # reporting them without changing the sheet.
  add_missing_group_rows: true

  # Block labels in column B of the grid sheet. Found by text, not by row number.
  blocks:
    in_house:       "Settlements (In House)"
    in_house_pace:  "Settlements (In House - Pace)"
    board:          "Settlements (Board)"
    board_pace:     "Settlements (Board - Pace)"
    cp:             "CP Settled Cases"
    collections:      "Collections"
    collections_pace: "Collections Pace"
