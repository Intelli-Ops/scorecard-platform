# Business rules for the all providers Weekly Scorecard.

case_ar:

  # PHASE 1 - which rows of Combined Owner Case AR are in scope.
  case_types:                # doc shorthand -> the real values in the file
    - Workers Compensation                      # "WC" / "Workers Compensation"
    - Copy Record (ML)                          # "CopyRecord"
    - Alternative Dispute Resolution (ADR)      # "Alternative"
    - WC MED-LEGAL                              # added Sep 2026 - All Providers only

  # PHASE 2 - rows whose BUSINESSREGID is not in the Provider List get dropped ("In Group column, filter out all the NA values delete all data").
  drop_rows_without_group: true

  # PHASE 2 - rows with no match in Custom Case AR get dropped.
  drop_rows_without_status: true

  # PHASE 2 - Case_Validity cleanup.
  validity_map:
    Valid-Stay: Valid
  validity_blank_becomes: Valid

  # PHASE 2 - Closing Order.
  closing_order_strip_prefix: 'CLOSING ORDER:'
  closing_order_keep:
    - C & R (GRANTED)
    - AWARD ON STIPULATED FINDS AND AWARD (GRANTED)
    - DISMISSAL OF CLAIM
  closing_order_default: CIC Pending

  # PHASE 3 - the pivot that produces Raw Data.
  raw_data_group_by: [CASEID, PROVIDER, BUSINESSREGID, Group, CASETYPE,
                      Closing Order, Case_Validity, FileStatus]
  raw_data_measures:  [BILLED, PAID, WRITEOFF, ADVANCE, OUTSTANDING]
  # Header text written onto the Raw Data sheet, in the same order as the two lists above.
  raw_data_headers: [CASEID, PROVIDER, BUSINESSREGID, Group, CASETYPE,
                     Closing Order, Validity, File Status,
                     " BILLED", " PAID", WRITEOFF, ADVANCE, OUTSTANDING]

# -
delta:
  # PHASE 4 - the 15 combine columns.
  sources:
    - sheet: WC Delta
      workbook: wc               # Master Settlement & Collection Delta WC
      columns:
        Date: Date
        Location: Location
        Case_ID: Case Id
        MRN: MRN
        Billed: Billed
        Paid: Paid
        Outstanding: Outstanding
        Settlement_Amount: Settlement Amount
        Settlement_Pct: Settlement %Age
        Provider_ID: ProviderID
        Provider: Provider
        Settlement_Payment: Settlement Payment
        Settlement_Payment_Received: Settlement Payment Received?
        Remaining_Payment: Remaining Payment
        File_Status: Settlement Payment Status
        Settlement_Type: Settlement Type
    - sheet: Med-Legal Delta
      workbook: mlcr
      columns:
        Date: Date
        Location: Location
        Case_ID: Case Id
        MRN: MRN
        Billed: Billed
        Paid: Paid
        Outstanding: Outstanding
        Settlement_Amount: Settlement Amount
        Settlement_Pct: Settlement %Age
        Provider_ID: ProviderID
        Provider: Provider
        Settlement_Payment: Settlement Payments        # note: plural
        Settlement_Payment_Received: Settlement Payment Received?
        Remaining_Payment: Remaining Payment
        File_Status: File Status
        Settlement_Type: Settlement Type
    - sheet: IMR Delta
      workbook: mlcr
      columns:
        Date: Date
        Location: Location
        Case_ID: Case Id
        MRN: MRN
        Billed: Billed
        Paid: Paid
        Outstanding: Outstanding
        Settlement_Amount: Settlement Amount
        Settlement_Pct: Settlement %Age
        Provider_ID: ProviderID
        Provider: Provider
        Settlement_Payment: Settlement Payment Received   # no "?" - a DIFFERENT
        Settlement_Payment_Received: Settlement Payment Received?   # column to this
        Remaining_Payment: Remaining Payment
        File_Status: New File Status
        Settlement_Type: Settlement Type

  # PHASE 5/6 - the only filter is "delete all NA in Group", i.e.
  drop_na_group: true

  # Which Settlement Type values count, per source sheet - the same rule as the GFS report.
  keep_settlement_types:
    Med-Legal Delta: [F&F]

  # PHASE 5 - Location splits the Settlement grids.
  locations:
    In House: in house
    Board: board

  # PHASE 6 - Delta Comparison-2026.
  payment_received_yes: SP - Y
  payment_received_no:  SP - N

# -
collections:
  sheet: "  Detail Payment Report"     # note the two leading spaces
  # Case types left out of Collections.
  drop_case_types: []
  # "in payment type make 'board reps' & 'in house rep', 'settlement'" = fold them into settlement, not rename them alongside it.
  fold_into_settlement: [BOARD REPS, IN HOUSE REPS, SETTLEMENT]
  payment_type_order: [BILLING, REBILLING, APPEAL, SETTLEMENT]
  # The sheet's "Week 01..05" are the weeks of the month as defined under `holidays:` below (a week belongs to the month of its Wednesday), the same as the Settlement grids.

# Weeks, months and pacing - the same calendar as the gfs report. a mon-fri week belongs to the month that holds most of its weekdays - the month its wednesday falls in. so mon 31 aug - fri 4 sep is september's week 1 (1-4 sep; 31 aug is counted in august's month total), and mon 28 sep - fri 2 oct is september's week 5 (28-30 sep; 1-2 oct are added to october's week 1, which then runs 1-9 oct). the month and week being reported come from the week folder's name. pacing = month-to-date / working days elapsed * working days in the month, written into the sheet as a formula (e.g. =sum(j9,k9)/8*21). a working day is a weekday that is not listed below. source: holidays.png (night shift) in the main project folder. 4 jul 2026 is a saturday, so its observed friday, 3 jul, is the day off. add each new year's dates here.
holidays:
  - 2026-01-01   # New Year
  - 2026-02-16   # Presidents' Day (U.S.)
  - 2026-03-20   # Eid ul-Fitr (Pakistan)
  - 2026-05-25   # Memorial Day (U.S.)
  - 2026-05-27   # Eid ul-Azha
  - 2026-07-03   # Independence Day (observed U.S.)
  - 2026-09-07   # Labour Day
  - 2026-11-26   # Thanksgiving Day (U.S.)
  - 2026-12-25   # Christmas Day

# -
kpi:
  sheet: "KPI High-Level "          # NOTE the trailing space - it is in the template
  period_row: 2                     # 'Period Start'; Excel serial dates
  first_col: 3                      # C
  last_col: 40                      # scan this far right

  provider_id_column: BUSINESSREGID       # in the Supporting File 'Provider List'
  provider_group_column: Provider Group

  # SQL-Doc export column names, as they come out of Superset.
  sql_doc_columns:
    provider_id: ProviderID
    type: Type
    month: DocumentMonth
    document_type: DocumentType
    cases: "#ofcases"

  # Unlike GFS this report does not filter SQL-Doc on Type.
  filter_type: null

  # Which SQL-Doc DocumentType feeds which block of the sheet.
  sql_blocks:
    SBR: Appeals/SBR
    DDE: BillingDocs

  # Phase 9 - the litigation / scorecard numbers table pasted from email.
  scorecard:
    file_match: [kpi, number]
    sheet: Sheet1
    block_markers:                  # header marker -> total marker, read in order
      GFS Client: GFS Total
      Russman Client: Russman Total
      Others Client: Others Total
    lookup_column: PROVIDER ID      # Supporting File column the provider name matches
    # Names in the numbers file that do not spell the Provider List PROVIDER ID the same way.
    provider_aliases:
      Support Claim West: SUPPORT CLAIMS WEST
      BHIPM: Beverly Hills Institute for Pain Management
      Soheil Enterprise DBA Alexander Pharmacy: Alexander Pharmacy
      JL Calpar Inc: JL Calpar
    metrics:                        # source column -> block whose rows are groups
      DOR Filing: DOR
      PMR Filing: PMR
      NTP Filing: NTP
      EOA Filing: Enforcement Of Agreement
      Medical Index: Medical Index
    totals:                         # source column -> [block, single row]
      NOI TO CP:       [Med Legal, NOI (COST)]
      NOI for Payment: [Med Legal, NOI for Payment]
      CP:              [Med Legal, Cost Petition]
      CP DOR:          [Med Legal, Cost Petition (DOR)]

  # Row labels on the KPI sheet that do not spell a Provider Group the same way.
  row_aliases:
    Support Claim West: SUPPORT CLAIMS WEST

  # Blocks the sheet carries that no source feeds.
  unsourced_blocks: ["10635 (DDEL)"]

# -
template:
  # Sheet names in the delivered workbook.
  grid_sheet:  "Collection High-Level-2026"
  delta_sheet: "Delta Comparison-2026"
  kpi_sheet:   "KPI High-Level "
  case_ar_sheet: "Case AR"
  raw_data_sheet: "Raw Data"
  # Sheets kept in the delivered file; anything else is dropped.
  keep_sheets:
    - "Collection High-Level-2026"
    - "Collection High-Level-2025"
    - "Delta Comparison-2026"
    - "Delta Comparison-2025"
    - "KPI High-Level "
    - "Case AR"
    - "Raw Data"
  # Add a row for any provider group that has figures this week and no row to put them on, immediately above that block's Total.
  add_missing_group_rows: true

  # Block labels in column B of the grid sheet.
  blocks:
    in_house:       "Settlements (In House)"
    in_house_pace:  "Settlements (In House - Pace)"
    board:          "Settlements (Board)"
    board_pace:     "Settlements (Board - Pace)"
    cp:             "CP Settled Cases"
    collections:      "Collections"
    collections_pace: "Collections Pace"
