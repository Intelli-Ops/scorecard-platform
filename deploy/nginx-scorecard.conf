# nginx in front of the Scorecard platform.
# Installed to /etc/nginx/sites-available/scorecard by install.sh, on the
# first install only: later installs leave it alone, so a server name or an
# HTTPS certificate added to it (certbot edits this file) is kept.
#
# It does two jobs:
#   /api/...   forwarded to the backend on 127.0.0.1:8000
#   the rest   the built React app, straight from disk

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    root /opt/scorecard/frontend/dist;
    index index.html;

    # Everything the app is sent is a few fields of JSON, except the weekly
    # files - so a megabyte is the most any address accepts, and only the
    # upload address below accepts more. With one large limit for the whole
    # site, anyone could post a gigabyte at the sign-in form.
    client_max_body_size 1m;

    # The upload address. Weekly source files are large (the biggest is about
    # 240 MB, a whole week about 385 MB). Keep this at or above
    # SCORECARD_MAX_UPLOAD_MB in /etc/scorecard/scorecard.env.
    location ~ ^/api/weeks/[^/]+/uploads/?$ {
        client_max_body_size 1100m;
        # Passed straight through rather than first saving a copy of every
        # file on nginx's own disk. The app checks who is sending before it
        # takes the files in.
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's own address, replacing anything the browser sent, so
        # nobody can write a made-up address into the activity log.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Built files carry a hash in their names (index-3f9a1c.js), so a new
    # version always has new names and these can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Every other address is a screen of the app (/weeks, /runs/12): send
    # index.html and let the app pick the screen. Never cached, so an update
    # is picked up on the next page load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        # The page may run only the scripts shipped with it and talk only to
        # this server. If a bug ever let someone slip a script into the page,
        # the browser would refuse to run it. (blob: is the CSV download;
        # inline styles are React's own.)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }
}
