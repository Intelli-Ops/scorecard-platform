# nginx in front of the Scorecard platform.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    root /opt/scorecard/frontend/dist;
    index index.html;

    # Everything the app is sent is a few fields of json, except the weekly files.
    client_max_body_size 1m;

    # The upload address.
    location ~ ^/api/weeks/[^/]+/uploads/?$ {
        client_max_body_size 1100m;
        # Passed straight through rather than first saving a copy of every file on nginx's own disk.
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's own address, replacing anything the browser sent, so nobody can write a made-up address into the activity log.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Built files carry a hash in their names (index-3f9a1c.js), so a new version always has new names and these can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Every other address is a screen of the app (/weeks, /runs/12).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        # The page may run only the scripts shipped with it and talk only to this server.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }
}
